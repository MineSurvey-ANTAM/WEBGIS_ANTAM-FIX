/* =========================================================
   DASHBOARD ANTAM - STYLE INDEX 5
   ========================================================= */

:root {
    --antam-dark: #001f1f;
    --antam-dark-2: #003b3b;
    --antam-teal: #00a6a6;
    --antam-gold: #f5b400;
}


/* =========================================================
   HEADER
   ========================================================= */

#dashboard-header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 90px;

    background: linear-gradient(
        135deg,
        #001f1f,
        #003b3b
    );

    color: white;

    display: flex;
    align-items: center;

    padding: 0 24px;
    box-sizing: border-box;

    z-index: 9000;

    border-bottom: 2px solid #00a6a6;
}


/* JUDUL */

#dashboard-title {
    margin-left: 65px;
}

#dashboard-title h1 {
    margin: 0;
    font-size: 24px;
    font-weight: 700;
}

#dashboard-title p {
    margin: 5px 0 0;
    font-size: 13px;
    opacity: .8;
}


/* JAM */

#dashboard-datetime {
    margin-left: auto;
    text-align: right;
    font-size: 12px;
    line-height: 1.5;
}


/* =========================================================
   SIDEBAR
   ========================================================= */

#sidebar {

    position: fixed;

    top: 90px;
    left: 0;
    bottom: 0;

    width: 270px;

    background: rgba(0,31,38,.97);

    color: white;

    z-index: 8500;

    overflow-y: auto;

    transition: transform .3s ease;

    box-shadow:
        3px 0 15px rgba(0,0,0,.25);

    box-sizing: border-box;

    padding-bottom: 30px;
}


/* SIDEBAR CLOSED */

#sidebar.dashboard-hidden {
    transform: translateX(-270px);
}


/* =========================================================
   BUTTON SIDEBAR
   ========================================================= */

#sidebar-toggle {

    position: fixed;

    left: 15px;
    top: 20px;

    width: 45px;
    height: 45px;

    z-index: 99999;

    display: flex;

    align-items: center;
    justify-content: center;

    background: #001f26;

    color: white;

    border:
        1px solid rgba(0,255,255,.3);

    border-radius: 7px;

    font-size: 25px;

    cursor: pointer;
}


/* =========================================================
   LOGO
   ========================================================= */

#sidebar-header {

    height: 100px;

    display: flex;

    justify-content: center;
    align-items: center;

    border-bottom:
        1px solid rgba(255,255,255,.1);
}

#sidebar-logo {

    width: 150px;
    height: 75px;

    object-fit: contain;
}


/* =========================================================
   SIDEBAR SECTION
   ========================================================= */

.sidebar-section {

    padding:
        15px 17px 5px;
}


.sidebar-title {

    color: #00a6a6;

    font-size: 11px;

    font-weight: bold;

    letter-spacing: 1px;

    margin-bottom: 9px;

    text-transform: uppercase;
}


/* =========================================================
   MENU
   ========================================================= */

.sidebar-menu {

    display: flex;

    align-items: center;

    gap: 10px;

    padding: 9px 10px;

    margin-bottom: 3px;

    border-radius: 6px;

    font-size: 13px;

    cursor: pointer;
}


.sidebar-menu:hover,
.sidebar-menu.active {

    background:
        rgba(0,166,166,.18);
}


/* =========================================================
   FILTER ROW
   ========================================================= */

.filter-row {

    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 7px 0;

    font-size: 12px;
}


/* =========================================================
   SWITCH
   ========================================================= */

.switch {

    position: relative;

    width: 38px;
    height: 20px;
}


.switch input {

    display: none;
}


.slider {

    position: absolute;

    inset: 0;

    background: #555;

    border-radius: 20px;

    cursor: pointer;

    transition: .2s;
}


.slider:before {

    content: "";

    position: absolute;

    width: 16px;
    height: 16px;

    left: 2px;
    top: 2px;

    background: white;

    border-radius: 50%;

    transition: .2s;
}


.switch input:checked + .slider {

    background: #00a6a6;
}


.switch input:checked
+ .slider:before {

    transform:
        translateX(18px);
}


/* =========================================================
   FILTER
   ========================================================= */

#rute-evakuasi-filter,
#rute-sementara-filter {
    width: 100%;

    box-sizing: border-box;

    padding: 8px;

    border-radius: 5px;

    border:
        1px solid #477;

    background: #002b2b;

    color: white;
}


/* =========================================================
   INFORMASI DARURAT
   ========================================================= */

.emergency-box {

    background:
        rgba(0,60,60,.45);

    border:
        1px solid rgba(0,166,166,.35);

    border-radius: 7px;

    padding: 10px;
}


.emergency-title {

    color: #f5b400;

    font-size: 11px;

    font-weight: 700;

    line-height: 1.5;

    margin-bottom: 8px;
}


.emergency-item {

    padding: 7px 0;

    border-bottom:
        1px solid rgba(255,255,255,.08);
}


.emergency-item:last-child {

    border-bottom: none;
}


.emergency-label {

    color: #ffffff;

    font-size: 11px;

    font-weight: 600;
}


.emergency-number {

    color: #00d4d4;

    font-size: 12px;

    font-weight: 700;

    margin-top: 2px;
}


.emergency-note {

    color: #aaa;

    font-size: 9px;

    margin-left: 4px;
}


/* =========================================================
   STATISTIK
   ========================================================= */

#dashboard-stats {

    position: fixed;

    top: 105px;

    left: 290px;

    right: 20px;

    z-index: 8000;

    display: grid;

    grid-template-columns:
        repeat(4,1fr);

    gap: 12px;

  pointer-events: auto;
}


.stat-card {

    background:
        rgba(255,255,255,.95);

    border-radius: 9px;

    border-left:
        4px solid #00a6a6;

    padding: 10px 14px;

    box-shadow:
        0 3px 12px rgba(0,0,0,.18);
}


.stat-title {

    font-size: 10px;

    color: #607070;

    font-weight: bold;

    text-transform: uppercase;
}


.stat-value {

    margin-top: 4px;

    font-size: 19px;

    color: #003b3b;

    font-weight: 800;
}


/* =========================================================
   RESPONSIVE
   ========================================================= */

@media(max-width:900px) {

    #dashboard-stats {

        left: 285px;

        grid-template-columns:
            repeat(2,1fr);
    }

}


@media(max-width:650px) {

    #dashboard-title h1 {

        font-size: 15px;
    }


    #dashboard-title p {

        display: none;
    }


    #dashboard-stats {

        left: 10px;

        right: 10px;

        top: 100px;

        grid-template-columns:
            repeat(2,1fr);
    }

}
/* =========================================================
   NAVIGASI REAL-TIME
   ========================================================= */

.navigation-card {
    border-left: 4px solid #f5b400;
}

.navigation-button {
    width: 100%;
    border: none;
    border-radius: 6px;
    padding: 7px 10px;
    margin-top: 5px;

    background: #00a6a6;
    color: white;

    font-size: 11px;
    font-weight: 700;

    cursor: pointer;
    transition: .2s;
}

.navigation-button:hover {
    background: #008b8b;
}

.navigation-button.stop {
    background: #d62828;
}

.navigation-button.stop:hover {
    background: #b71c1c;
}

/* Marker GPS */

.user-location-marker {
    width: 18px;
    height: 18px;

    background: #008cff;

    border: 3px solid white;
    border-radius: 50%;

    box-shadow:
        0 0 0 6px rgba(0,140,255,.25),
        0 2px 8px rgba(0,0,0,.35);
}

/* Garis rute navigasi */

.navigation-route {
    color: #00a6a6;
    weight: 6;
    opacity: .85;
}

/* Garis progress */

.navigation-progress {
    color: #00a6a6;
    weight: 8;
    opacity: 1;
}
.gps-user-marker {
    background: transparent !important;
    border: none !important;
}

.gps-user-dot {
    width: 30px;
    height: 30px;

    border-radius: 50%;

    background: #00a6a6;

    border: 3px solid white;

    display: flex;

    align-items: center;
    justify-content: center;

    box-shadow:
        0 2px 8px rgba(0,0,0,.5);
}

.gps-user-arrow {
    color: white;
    font-size: 14px;
}
</style>

        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    var img = popup._contentNode.querySelector('td img');
                    if (img) {
                        // If already loaded (cache), update immediately
                        if (img.complete && img.naturalHeight > 0) {
                            popup.update();
                        } else {
                            img.addEventListener('load', function() {
                                popup.update();
                            });
                            img.addEventListener('error', function() {
                                popup.update();
                            });
                        }
                    }
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }

            </div>
        `;
        document.body.appendChild(header);

        /* ================= 4 KARTU SESUAI REQUEST ================= */
        var stats = document.createElement("div");
        stats.id = "dashboard-stats";
        stats.innerHTML = `
            <div class="stat-card">
                <div class="stat-title">Total Panjang Jalur</div>
                <div class="stat-value" id="navigation-total">20,54 km</div>
            </div>

            <div class="stat-card navigation-card">
                <div class="stat-title">Jarak Ditempuh</div>
                <div class="stat-value" id="navigation-ditempuh">0 m</div>
            </div>

            <div class="stat-card navigation-card">
                <div class="stat-title">Jarak Tersisa</div>
                <div class="stat-value" id="navigation-tersisa">20,54 km</div>
            </div>

            <div class="stat-card navigation-card">
                <div class="stat-title">Navigasi</div>
                <button id="navigation-button" class="navigation-button">
                    ▶ Mulai Navigasi
                </button>
            </div>
        `;
        document.body.appendChild(stats);

        /* ================= SIDEBAR TOGGLE ================= */
        button.addEventListener("click", function () {
            sidebar.classList.toggle("dashboard-hidden");
            setTimeout(function () {
                if (typeof map !== "undefined") map.invalidateSize();
            }, 300);
        });

        /* ================= MENU ================= */
        document.getElementById("menu-peta").addEventListener("click", function () {
            document.querySelectorAll(".sidebar-menu").forEach(function (el) {
                el.classList.remove("active");
            });
            this.classList.add("active");
            if (typeof map !== "undefined") {
                map.fitBounds([
                    [-6.684066002531283,106.53662349192211],
                    [-6.630515780933659,106.61805571178635]
                ]);
            }
        });

        document.getElementById("menu-tentang").addEventListener("click", function () {
            document.querySelectorAll(".sidebar-menu").forEach(function (el) {
                el.classList.remove("active");
            });
            this.classList.add("active");
            alert(
                "WebGIS Evakuasi ANTAM Pongkor\\n\\n" +
                "WebGIS ini menampilkan rute evakuasi utama, " +
                "rute evakuasi sementara, titik kumpul, dan fasilitas kesehatan."
            );
        });

        var filterRute = document.getElementById("rute-evakuasi-filter");
        var filterRuteSementara = document.getElementById("rute-sementara-filter");

        /* ================= DROPDOWN RUTE UTAMA ================= */
        if (typeof json_evakuasi_utama_3_4 !== "undefined" && filterRute) {
            var utamaSet = new Set();

            json_evakuasi_utama_3_4.features.forEach(function (feature) {
                var p = feature.properties || {};
                var awal = String(p["Lokasi Awal"] ?? "").trim();
                var tujuan = String(p["Tujuan"] ?? "").trim();
                if (awal && tujuan) utamaSet.add(awal + " → " + tujuan);
            });

            Array.from(utamaSet).sort().forEach(function (nama) {
                var option = document.createElement("option");
                option.value = nama;
                option.textContent = nama;
                filterRute.appendChild(option);
            });
        }

        /* ================= DROPDOWN RUTE SEMENTARA ================= */
        if (typeof json_JALUR_TITIK_KUMPUL_3 !== "undefined" && filterRuteSementara) {
            var sementaraSet = new Set();

            json_JALUR_TITIK_KUMPUL_3.features.forEach(function (feature) {
                var p = feature.properties || {};
                var nama = String(p["Keterangan"] ?? "").trim();
                if (nama) sementaraSet.add(nama);
            });

            Array.from(sementaraSet).sort().forEach(function (nama) {
                var option = document.createElement("option");
                option.value = nama;
                option.textContent = nama;
                filterRuteSementara.appendChild(option);
            });
        }

        function filterUtama(selected) {
            if (typeof layer_evakuasi_utama_3_4 === "undefined") return;
            layer_evakuasi_utama_3_4.eachLayer(function (layer) {
                if (!layer.feature) return;
                var p = layer.feature.properties || {};
                var nama =
                    String(p["Lokasi Awal"] ?? "").trim() +
                    " → " +
                    String(p["Tujuan"] ?? "").trim();

                // Tidak ada rute yang ditampilkan sebelum pengguna memilih.
                setLayerVisible(layer, !!selected && nama === selected);
            });
        }

        function filterSementara(selected) {
            if (typeof layer_JALUR_TITIK_KUMPUL_3 === "undefined") return;
            layer_JALUR_TITIK_KUMPUL_3.eachLayer(function (layer) {
                if (!layer.feature) return;
                var p = layer.feature.properties || {};
                var nama = String(p["Keterangan"] ?? "").trim();

                // Tidak ada rute yang ditampilkan sebelum pengguna memilih.
                setLayerVisible(layer, !!selected && nama === selected);
            });
        }

        if (filterRute) {
            filterRute.addEventListener("change", function () {
                if (document.getElementById("toggle-rute").checked) {
                    filterUtama(this.value);
                } else {
                    setLayerVisible(layer_evakuasi_utama_3_4, false);
                }
                updateNavigationStats();
            });
        }

        if (filterRuteSementara) {
            filterRuteSementara.addEventListener("change", function () {
                if (document.getElementById("toggle-rute-sementara").checked) {
                    filterSementara(this.value);
                } else {
                    setLayerVisible(layer_JALUR_TITIK_KUMPUL_3, false);
                }
            });
        }

        /* ================= TOGGLE LAYER ================= */
        document.getElementById("toggle-rute").addEventListener("change", function () {
            if (this.checked) {
                var pilihUtama = document.getElementById("rute-evakuasi-filter");
                filterUtama(pilihUtama ? pilihUtama.value : "");
            } else {
                setLayerVisible(layer_evakuasi_utama_3_4, false);
            }
        });

        document.getElementById("toggle-rute-sementara").addEventListener("change", function () {
            if (this.checked) {
                var pilihSementara = document.getElementById("rute-sementara-filter");
                filterSementara(pilihSementara ? pilihSementara.value : "");
            } else {
                setLayerVisible(layer_JALUR_TITIK_KUMPUL_3, false);
            }
        });

        document.getElementById("toggle-kumpul").addEventListener("change", function () {
            toggleLayer(layer_TITIK_KUMPUL_Sementara_1, this.checked);
        });

        document.getElementById("toggle-fasilitas").addEventListener("change", function () {
            toggleLayer(layer_FasilitasKesehatan_2, this.checked);
        });

        /* ================= JAM ================= */
        function updateClock() {
            var now = new Date();
            var date = document.getElementById("dashboard-date");
            var time = document.getElementById("dashboard-time");

            if (date) {
                date.textContent = now.toLocaleDateString("id-ID", {
                    day: "2-digit",
                    month: "long",
                    year: "numeric"
                });
            }

            if (time) {
                time.textContent = now.toLocaleTimeString("id-ID", {
                    hour: "2-digit",
                    minute: "2-digit",
                    second: "2-digit"
                });
            }
        }

        updateClock();
        setInterval(updateClock, 1000);

        /* ================= KONDISI AWAL ================= */
        filterUtama("");
        filterSementara("");

        setTimeout(function () {
            map.invalidateSize();
        }, 500);
    }

    tungguPeta(buatDashboard);
})();
</script>

		<!-- =========================================================
     NAVIGASI EVAKUASI REAL-TIME - FINAL
     GPS hanya aktif setelah tombol "Mulai Navigasi" ditekan.
     ========================================================= -->
<script>
(function () {
    "use strict";

    var navigationActive = false;
    var watchId = null;
    var userMarker = null;
    var accuracyCircle = null;
    var lastPosition = null;
    var distanceTravelled = 0;

    function hitungJarak(lat1, lon1, lat2, lon2) {
        var R = 6371000;
        var dLat = (lat2 - lat1) * Math.PI / 180;
        var dLon = (lon2 - lon1) * Math.PI / 180;

        var a =
            Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(lat1 * Math.PI / 180) *
            Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon / 2) * Math.sin(dLon / 2);

        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function formatJarak(meter) {
        if (!Number.isFinite(meter)) return "-";
        if (meter >= 1000) {
            return (meter / 1000).toLocaleString("id-ID", {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }) + " km";
        }
        return Math.round(meter).toLocaleString("id-ID") + " m";
    }

    function getSelectedRouteLength() {
        var filter = document.getElementById("rute-evakuasi-filter");
        var selected = filter ? filter.value : "";
        var total = 0;

        if (typeof json_evakuasi_utama_3_4 === "undefined") {
            return 20540;
        }

        json_evakuasi_utama_3_4.features.forEach(function (feature) {
            var p = feature.properties || {};
            var nama =
                String(p["Lokasi Awal"] ?? "").trim() +
                " → " +
                String(p["Tujuan"] ?? "").trim();

            if (!selected || nama !== selected) return;

            var raw = p["Jarak Jalur Evakuasi"];
            var nilai = 0;

            if (raw !== null && raw !== undefined && String(raw).trim() !== "") {
                var angka = String(raw)
                    .replace(/\s/g, "")
                    .replace(",", ".")
                    .replace(/[^\d.-]/g, "");
                nilai = Number(angka);
            }

            if (Number.isFinite(nilai) && nilai > 0) {
                total += nilai;
            }
        });

        /* Nilai dashboard utama yang diminta: 20,54 km */
        return total > 0 ? total : 20540;
    }

    function updateNavigationStats() {
        var total = getSelectedRouteLength();
        var totalEl = document.getElementById("navigation-total");
        var ditempuhEl = document.getElementById("navigation-ditempuh");
        var tersisaEl = document.getElementById("navigation-tersisa");

        if (totalEl) totalEl.textContent = formatJarak(total);
        if (ditempuhEl) ditempuhEl.textContent = formatJarak(distanceTravelled);
        if (tersisaEl) {
            tersisaEl.textContent = formatJarak(
                Math.max(0, total - distanceTravelled)
            );
        }
    }

    function updateNavigationButton() {
        var tombol = document.getElementById("navigation-button");
        if (!tombol) return;

        if (navigationActive) {
            tombol.textContent = "■ Hentikan Navigasi";
            tombol.classList.add("stop");
        } else {
            tombol.textContent = "▶ Mulai Navigasi";
            tombol.classList.remove("stop");
        }
    }

    function tampilkanPosisi(position) {
        if (!navigationActive) return;

        var lat = position.coords.latitude;
        var lng = position.coords.longitude;
        var accuracy = position.coords.accuracy;

        if (!Number.isFinite(lat) || !Number.isFinite(lng)) return;
        if (!Number.isFinite(accuracy)) return;

        var posisi = [lat, lng];

        if (!userMarker) {
            userMarker = L.marker(posisi, {
                icon: L.divIcon({
                    className: "gps-user-marker",
                    html:
                        '<div class="gps-user-dot">' +
                        '<div class="gps-user-arrow">●</div>' +
                        '</div>',
                    iconSize: [36, 36],
                    iconAnchor: [18, 18]
                }),
                zIndexOffset: 10000
            }).addTo(map);
        } else {
            userMarker.setLatLng(posisi);
        }

        if (!accuracyCircle) {
            accuracyCircle = L.circle(posisi, {
                radius: accuracy,
                color: "#00a6a6",
                weight: 1,
                fillColor: "#00a6a6",
                fillOpacity: 0.12
            }).addTo(map);
        } else {
            accuracyCircle.setLatLng(posisi);
            accuracyCircle.setRadius(accuracy);
        }

        if (lastPosition) {
            var jarak = hitungJarak(
                lastPosition.lat,
                lastPosition.lng,
                lat,
                lng
            );

            var dt = (Date.now() - lastPosition.time) / 1000;
            var kecepatan = dt > 0 ? jarak / dt : 0;
            var threshold = Math.max(6, accuracy * 0.5);

            if (
                jarak >= threshold &&
                kecepatan >= 0.5 &&
                kecepatan <= 8
            ) {
                distanceTravelled += jarak;
            }
        }

        lastPosition = {
            lat: lat,
            lng: lng,
            time: Date.now()
        };

        updateNavigationStats();

        /* Peta baru mengikuti GPS setelah navigasi aktif */
        if (accuracy <= 50) {
            map.setView(
                posisi,
                Math.max(map.getZoom(), 17),
                { animate: true }
            );
        }
    }

    function gpsError(error) {
        console.error("GPS Error:", error);

        if (error && error.code === 1) {
            alert("Izin lokasi ditolak. Aktifkan izin lokasi browser untuk menggunakan navigasi.");
        } else {
            alert("Lokasi GPS tidak dapat diperoleh. Pastikan GPS/izin lokasi aktif.");
        }

        hentikanNavigasi();
    }

    function mulaiNavigasi() {
        if (!navigator.geolocation) {
            alert("Browser tidak mendukung GPS.");
            return;
        }

        navigationActive = true;
        distanceTravelled = 0;
        lastPosition = null;

        updateNavigationStats();
        updateNavigationButton();

        navigator.geolocation.getCurrentPosition(
            tampilkanPosisi,
            gpsError,
            {
                enableHighAccuracy: true,
                timeout: 15000,
                maximumAge: 0
            }
        );

        watchId = navigator.geolocation.watchPosition(
            tampilkanPosisi,
            gpsError,
            {
                enableHighAccuracy: true,
                timeout: 15000,
                maximumAge: 1000
            }
        );
    }

    function hentikanNavigasi() {
        navigationActive = false;

        if (watchId !== null) {
            navigator.geolocation.clearWatch(watchId);
            watchId = null;
        }

        if (userMarker) {
            map.removeLayer(userMarker);
            userMarker = null;
        }

        if (accuracyCircle) {
            map.removeLayer(accuracyCircle);
            accuracyCircle = null;
        }

        lastPosition = null;
        updateNavigationButton();
        updateNavigationStats();
    }

    function pasangTombolNavigasi() {
        var tombol = document.getElementById("navigation-button");
        if (!tombol) {
            setTimeout(pasangTombolNavigasi, 300);
            return;
        }

        tombol.addEventListener("click", function () {
            if (navigationActive) {
                hentikanNavigasi();
            } else {
                mulaiNavigasi();
            }
        });

        updateNavigationStats();
        updateNavigationButton();
    }

    document.addEventListener("change", function (event) {
        if (
            event.target &&
            event.target.id === "rute-evakuasi-filter"
        ) {
            distanceTravelled = 0;
            updateNavigationStats();
        }
    });

    pasangTombolNavigasi();
})();
</script>

        <style>

/* =========================================================
   DASHBOARD ANTAM - STYLE INDEX 5
   ========================================================= */

:root {
    --antam-dark: #001f1f;
    --antam-dark-2: #003b3b;
    --antam-teal: #00a6a6;
    --antam-gold: #f5b400;
}


/* =========================================================
   HEADER
   ========================================================= */

#dashboard-header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 90px;

    background: linear-gradient(
        135deg,
        #001f1f,
        #003b3b
    );

    color: white;

    display: flex;
    align-items: center;

    padding: 0 24px;
    box-sizing: border-box;

    z-index: 9000;

    border-bottom: 2px solid #00a6a6;
}


/* JUDUL */

#dashboard-title {
    margin-left: 65px;
}

#dashboard-title h1 {
    margin: 0;
    font-size: 24px;
    font-weight: 700;
}

#dashboard-title p {
    margin: 5px 0 0;
    font-size: 13px;
    opacity: .8;
}


/* JAM */

#dashboard-datetime {
    margin-left: auto;
    text-align: right;
    font-size: 12px;
    line-height: 1.5;
}


/* =========================================================
   SIDEBAR
   ========================================================= */

#sidebar {

    position: fixed;

    top: 90px;
    left: 0;
    bottom: 0;

    width: 270px;

    background: rgba(0,31,38,.97);

    color: white;

    z-index: 8500;

    overflow-y: auto;

    transition: transform .3s ease;

    box-shadow:
        3px 0 15px rgba(0,0,0,.25);

    box-sizing: border-box;

    padding-bottom: 30px;
}


/* SIDEBAR CLOSED */

#sidebar.dashboard-hidden {
    transform: translateX(-270px);
}


/* =========================================================
   BUTTON SIDEBAR
   ========================================================= */

#sidebar-toggle {

    position: fixed;

    left: 15px;
    top: 20px;

    width: 45px;
    height: 45px;

    z-index: 99999;

    display: flex;

    align-items: center;
    justify-content: center;

    background: #001f26;

    color: white;

    border:
        1px solid rgba(0,255,255,.3);

    border-radius: 7px;

    font-size: 25px;

    cursor: pointer;
}


/* =========================================================
   LOGO
   ========================================================= */

#sidebar-header {

    height: 100px;

    display: flex;

    justify-content: center;
    align-items: center;

    border-bottom:
        1px solid rgba(255,255,255,.1);
}

#sidebar-logo {

    width: 150px;
    height: 75px;

    object-fit: contain;
}


/* =========================================================
   SIDEBAR SECTION
   ========================================================= */

.sidebar-section {

    padding:
        15px 17px 5px;
}


.sidebar-title {

    color: #00a6a6;

    font-size: 11px;

    font-weight: bold;

    letter-spacing: 1px;

    margin-bottom: 9px;

    text-transform: uppercase;
}


/* =========================================================
   MENU
   ========================================================= */

.sidebar-menu {

    display: flex;

    align-items: center;

    gap: 10px;

    padding: 9px 10px;

    margin-bottom: 3px;

    border-radius: 6px;

    font-size: 13px;

    cursor: pointer;
}


.sidebar-menu:hover,
.sidebar-menu.active {

    background:
        rgba(0,166,166,.18);
}


/* =========================================================
   FILTER ROW
   ========================================================= */

.filter-row {

    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 7px 0;

    font-size: 12px;
}


/* =========================================================
   SWITCH
   ========================================================= */

.switch {

    position: relative;

    width: 38px;
    height: 20px;
}


.switch input {

    display: none;
}


.slider {

    position: absolute;

    inset: 0;

    background: #555;

    border-radius: 20px;

    cursor: pointer;

    transition: .2s;
}


.slider:before {

    content: "";

    position: absolute;

    width: 16px;
    height: 16px;

    left: 2px;
    top: 2px;

    background: white;

    border-radius: 50%;

    transition: .2s;
}


.switch input:checked + .slider {

    background: #00a6a6;
}


.switch input:checked
+ .slider:before {

    transform:
        translateX(18px);
}


/* =========================================================
   FILTER
   ========================================================= */

#rute-evakuasi-filter {
    width: 100%;

    box-sizing: border-box;

    padding: 8px;

    border-radius: 5px;

    border:
        1px solid #477;

    background: #002b2b;

    color: white;
}


/* =========================================================
   INFORMASI DARURAT
   ========================================================= */

.emergency-box {

    background:
        rgba(0,60,60,.45);

    border:
        1px solid rgba(0,166,166,.35);

    border-radius: 7px;

    padding: 10px;
}


.emergency-title {

    color: #f5b400;

    font-size: 11px;

    font-weight: 700;

    line-height: 1.5;

    margin-bottom: 8px;
}


.emergency-item {

    padding: 7px 0;

    border-bottom:
        1px solid rgba(255,255,255,.08);
}


.emergency-item:last-child {

    border-bottom: none;
}


.emergency-label {

    color: #ffffff;

    font-size: 11px;

    font-weight: 600;
}


.emergency-number {

    color: #00d4d4;

    font-size: 12px;

    font-weight: 700;

    margin-top: 2px;
}


.emergency-note {

    color: #aaa;

    font-size: 9px;

    margin-left: 4px;
}


/* =========================================================
   STATISTIK
   ========================================================= */

#dashboard-stats {

    position: fixed;

    top: 105px;

    left: 290px;

    right: 20px;

    z-index: 8000;

    display: grid;

    grid-template-columns:
        repeat(4,1fr);

    gap: 12px;

  pointer-events: auto;
}


.stat-card {

    background:
        rgba(255,255,255,.95);

    border-radius: 9px;

    border-left:
        4px solid #00a6a6;

    padding: 10px 14px;

    box-shadow:
        0 3px 12px rgba(0,0,0,.18);
}


.stat-title {

    font-size: 10px;

    color: #607070;

    font-weight: bold;

    text-transform: uppercase;
}


.stat-value {

    margin-top: 4px;

    font-size: 19px;

    color: #003b3b;

    font-weight: 800;
}


/* =========================================================
   RESPONSIVE
   ========================================================= */

@media(max-width:900px) {

    #dashboard-stats {

        left: 285px;

        grid-template-columns:
            repeat(2,1fr);
    }

}


@media(max-width:650px) {

    #dashboard-title h1 {

        font-size: 15px;
    }


    #dashboard-title p {

        display: none;
    }


    #dashboard-stats {

        left: 10px;

        right: 10px;

        top: 100px;

        grid-template-columns:
            repeat(2,1fr);
    }

}
/* =========================================================
   NAVIGASI REAL-TIME
   ========================================================= */

.navigation-card {
    border-left: 4px solid #f5b400;
}

.navigation-button {
    width: 100%;
    border: none;
    border-radius: 6px;
    padding: 7px 10px;
    margin-top: 5px;

    background: #00a6a6;
    color: white;

    font-size: 11px;
    font-weight: 700;

    cursor: pointer;
    transition: .2s;
}

.navigation-button:hover {
    background: #008b8b;
}

.navigation-button.stop {
    background: #d62828;
}

.navigation-button.stop:hover {
    background: #b71c1c;
}

/* Marker GPS */

.user-location-marker {
    width: 18px;
    height: 18px;

    background: #008cff;

    border: 3px solid white;
    border-radius: 50%;

    box-shadow:
        0 0 0 6px rgba(0,140,255,.25),
        0 2px 8px rgba(0,0,0,.35);
}

/* Garis rute navigasi */

.navigation-route {
    color: #00a6a6;
    weight: 6;
    opacity: .85;
}

/* Garis progress */

.navigation-progress {
    color: #00a6a6;
    weight: 8;
    opacity: 1;
}
.gps-user-marker {
    background: transparent !important;
    border: none !important;
}

.gps-user-dot {
    width: 30px;
    height: 30px;

    border-radius: 50%;

    background: #00a6a6;

    border: 3px solid white;

    display: flex;

    align-items: center;
    justify-content: center;

    box-shadow:
        0 2px 8px rgba(0,0,0,.5);
}

.gps-user-arrow {
    color: white;
    font-size: 14px;
}
</style>

        <script>
        var highlightLayer;
        function highlightFeature(e) {
            highlightLayer = e.target;

            if (e.target.feature.geometry.type === 'LineString' || e.target.feature.geometry.type === 'MultiLineString') {
              highlightLayer.setStyle({
                color: 'rgba(255, 255, 0, 1.00)',
              });
            } else {
              highlightLayer.setStyle({
                fillColor: 'rgba(255, 255, 0, 1.00)',

              });

        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    var img = popup._contentNode.querySelector('td img');
                    if (img) {
                        // If already loaded (cache), update immediately
                        if (img.complete && img.naturalHeight > 0) {
                            popup.update();
                        } else {
                            img.addEventListener('load', function() {
                                popup.update();
                            });
                            img.addEventListener('error', function() {
                                popup.update();
                            });
                        }
                    }
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }

<script>

(function () {

    "use strict";

    var navigationActive = false;
    var watchId = null;

    var userMarker = null;
    var accuracyCircle = null;

    var routeLine = null;
    var progressLine = null;

    var lastPosition = null;
    var distanceTravelled = 0;

	var markerGPS = null;
var circleGPS = null;


    /* =====================================================
       HITUNG JARAK ANTAR KOORDINAT
       ===================================================== */

    function hitungJarak(lat1, lon1, lat2, lon2) {

        var R = 6371000;

        var dLat =
            (lat2 - lat1) *
            Math.PI / 180;

        var dLon =
            (lon2 - lon1) *
            Math.PI / 180;

        var a =
            Math.sin(dLat / 2) *
            Math.sin(dLat / 2) +

            Math.cos(lat1 * Math.PI / 180) *
            Math.cos(lat2 * Math.PI / 180) *

            Math.sin(dLon / 2) *
            Math.sin(dLon / 2);

        var c =
            2 *
            Math.atan2(
                Math.sqrt(a),
                Math.sqrt(1 - a)
            );

        return R * c;

    }


    /* =====================================================
       FORMAT JARAK
       ===================================================== */

    function formatJarak(meter) {

        if (
            meter === null ||
            meter === undefined ||
            !Number.isFinite(meter)
        ) {

            return "-";

        }

        if (meter >= 1000) {

            return (
                meter / 1000
            ).toLocaleString(
                "id-ID",
                {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                }
            ) + " km";

        }

        return (
            Math.round(meter)
        ).toLocaleString(
            "id-ID"
        ) + " m";

    }


    /* =====================================================
       AMBIL TOTAL PANJANG RUTE TERPILIH
       ===================================================== */

    function getSelectedRouteLength() {

        var filter =
            document.getElementById(
                "rute-evakuasi-filter"
            );

        if (!filter) {

            return 0;

        }

        var selected =
            filter.value;

        var total = 0;


        if (
            typeof json_evakuasi_utama_3_4 ===
            "undefined"
        ) {

            return 0;

        }


        json_evakuasi_utama_3_4.features
            .forEach(function (feature) {

                var p =
                    feature.properties || {};

                var lokasi =
                    String(
                        p["Lokasi Awal"] ?? ""
                    ).trim();

                var tujuan =
                    String(
                        p["Tujuan"] ?? ""
                    ).trim();

                var namaRute =
                    lokasi +
                    " → " +
                    tujuan;


                if (
                    selected !== "SEMUA_RUTE" &&
                    namaRute !== selected
                ) {

                    return;

                }


                var raw =
                    p[
                        "Jarak Jalur Evakuasi"
                    ];


                if (
                    raw !== null &&
                    raw !== undefined
                ) {

                    var angka =
                        String(raw)
                            .replace(",", ".")
                            .replace(
                                /[^\d.-]/g,
                                ""
                            );

                    var nilai =
                        Number(angka);


                    if (
                        Number.isFinite(nilai)
                    ) {

                        total += nilai;

                    }

                }

            });


        return total;

    }


    /* =====================================================
       UPDATE STATISTIK NAVIGASI
       ===================================================== */

    function updateNavigationStats() {

        var ditempuh =
            document.getElementById(
                "navigation-ditempuh"
            );

        var tersisa =
            document.getElementById(
                "navigation-tersisa"
            );


        if (ditempuh) {

            ditempuh.textContent =
                formatJarak(
                    distanceTravelled
                );

        }


        if (tersisa) {

            var totalRute =
                getSelectedRouteLength();


            var sisa =
                Math.max(
                    0,
                    totalRute -
                    distanceTravelled
                );


            tersisa.textContent =
                formatJarak(sisa);

        }

    }


  /* =====================================================
   GPS BERUBAH - FILTER GPS DRIFT
   ===================================================== */

function posisiBerubah(position) {

    var lat =
        position.coords.latitude;

    var lng =
        position.coords.longitude;

    var accuracy =
        position.coords.accuracy;


    /* =================================================
       FILTER AKURASI GPS
       ================================================= */

  if (
    !Number.isFinite(accuracy)
) {

    console.log(
        "GPS tidak valid"
    );

    return;

}

console.log(
    "GPS diterima - akurasi:",
    accuracy,
    "meter"
);

    /* =================================================
       POSISI USER
       ================================================= */

    var posisiUser =
        [lat, lng];


    /* =================================================
       MARKER POSISI USER
       ================================================= */

    if (!userMarker) {

        userMarker =
            L.marker(
                posisiUser,
                {
                    icon: L.divIcon({

                        className:
                            "gps-user-marker",

                        html:
                            '<div class="gps-user-dot">' +
                            '<div class="gps-user-arrow">●</div>' +
                            '</div>',

                        iconSize:
                            [36, 36],

                        iconAnchor:
                            [18, 18]

                    }),

                    zIndexOffset:
                        10000
                }
            )
            .addTo(map);

    } else {

        userMarker.setLatLng(
            posisiUser
        );

    }


    /* =================================================
       LINGKARAN AKURASI GPS
       ================================================= */

    if (!accuracyCircle) {

        accuracyCircle =
            L.circle(
                posisiUser,
                {
                    radius:
                        accuracy,

                    color:
                        '#00a6a6',

                    weight:
                        1,

                    fillColor:
                        '#00a6a6',

                    fillOpacity:
                        0.12
                }
            )
            .addTo(map);

    } else {

        accuracyCircle.setLatLng(
            posisiUser
        );

        accuracyCircle.setRadius(
            accuracy
        );

    }


    /* =================================================
       HITUNG JARAK TEMPUH
       ================================================= */

    if (lastPosition) {

        var jarak =
            hitungJarak(
                lastPosition.lat,
                lastPosition.lng,
                lat,
                lng
            );


        var threshold =
            Math.max(
                6,
                accuracy * 0.5
            );


        var waktuSekarang =
            Date.now();


        var selisihWaktu =
            (
                waktuSekarang -
                lastPosition.time
            ) / 1000;


        var kecepatan =
            selisihWaktu > 0
                ? jarak / selisihWaktu
                : 0;


        if (
            jarak < threshold
        ) {

            console.log(
                "GPS drift diabaikan:",
                jarak.toFixed(1),
                "m"
            );

        }

        else if (
            kecepatan >= 0.5 &&
            kecepatan <= 8
        ) {

            distanceTravelled +=
                jarak;

            console.log(
                "Pergerakan diterima:",
                jarak.toFixed(1),
                "m"
            );

        }

    }


    /* =================================================
       SIMPAN POSISI TERAKHIR
       ================================================= */

    lastPosition = {

        lat: lat,

        lng: lng,

        time: Date.now()

    };


    /* =================================================
       UPDATE STATISTIK
       ================================================= */

    updateNavigationStats();


    /* =================================================
       IKUTI POSISI USER
       ================================================= */

    if (navigationActive) {

        map.setView(
            posisiUser,
            Math.max(
                map.getZoom(),
                17
            ),
            {
                animate: true
            }
        );

    }

}


    /* =====================================================
       GPS ERROR
       ===================================================== */

    function gpsError(error) {

        console.error(
            "GPS Error:",
            error
        );

        alert(
            "Lokasi GPS tidak dapat diperoleh.\n\n" +
            "Pastikan izin lokasi browser sudah diaktifkan."
        );

    }


    /* =====================================================
       MULAI NAVIGASI
       ===================================================== */

    function mulaiNavigasi() {

        if (!navigator.geolocation) {

            alert(
                "Browser tidak mendukung GPS."
            );

            return;

        }


        navigationActive = true;

        distanceTravelled = 0;

        lastPosition = null;


        updateNavigationStats();


        /* ==============================
           MINTA POSISI AWAL
           ============================== */

        navigator.geolocation.getCurrentPosition(
            posisiBerubah,
            gpsError,
            {
                enableHighAccuracy: true,
                timeout: 15000,
                maximumAge: 0
            }
        );


        /* ==============================
           PANTAU GPS TERUS
           ============================== */

        watchId =
            navigator.geolocation.watchPosition(
                posisiBerubah,
                gpsError,
                {
                    enableHighAccuracy: true,
                    timeout: 15000,
                    maximumAge: 1000
                }
            );


        updateNavigationButton();

    }


    /* =====================================================
       HENTIKAN NAVIGASI
       ===================================================== */

    function hentikanNavigasi() {

        navigationActive = false;


        if (
            watchId !== null
        ) {

            navigator.geolocation.clearWatch(
                watchId
            );

            watchId = null;

        }


        if (userMarker) {

            map.removeLayer(
                userMarker
            );

            userMarker = null;

        }


        if (accuracyCircle) {

            map.removeLayer(
                accuracyCircle
            );

            accuracyCircle = null;

        }


        lastPosition = null;


        updateNavigationButton();

    }


    /* =====================================================
       TOMBOL NAVIGASI
       ===================================================== */

    function updateNavigationButton() {

        var tombol =
            document.getElementById(
                "navigation-button"
            );


        if (!tombol) {

            return;

        }


        if (navigationActive) {

            tombol.textContent =
                "■ Hentikan Navigasi";

            tombol.classList.add(
                "stop"
            );

        } else {

            tombol.textContent =
                "▶ Mulai Navigasi";

            tombol.classList.remove(
                "stop"
            );

        }

    }


    /* =====================================================
       BUAT 4 TOOLBAR
       ===================================================== */

    function buatNavigationToolbar() {

        var stats =
            document.getElementById(
                "dashboard-stats"
            );


        if (!stats) {

            return;

        }


        /*
         * Kita tetap menggunakan
         * 4 toolbar saja.
         */

        stats.innerHTML = `

            <div class="stat-card">

                <div class="stat-title">
                    Total Panjang Jalur
                </div>

                <div
                    class="stat-value"
                    id="navigation-total"
                >
                    -
                </div>

            </div>


            <div class="stat-card navigation-card">

                <div class="stat-title">
                    Jarak Ditempuh
                </div>

                <div
                    class="stat-value"
                    id="navigation-ditempuh"
                >
                    0 m
                </div>

            </div>


            <div class="stat-card navigation-card">

                <div class="stat-title">
                    Jarak Tersisa
                </div>

                <div
                    class="stat-value"
                    id="navigation-tersisa"
                >
                    -
                </div>

            </div>


            <div class="stat-card navigation-card">

                <div class="stat-title">
                    Navigasi
                </div>

                <button
                    id="navigation-button"
                    class="navigation-button"
                >
                    ▶ Mulai Navigasi
                </button>

            </div>

        `;


        /* ==============================
           TOTAL RUTE
           ============================== */

        var total =
            getSelectedRouteLength();


        var totalElement =
            document.getElementById(
                "navigation-total"
            );


        if (totalElement) {

            totalElement.textContent =
                formatJarak(total);

        }


        /* ==============================
           EVENT TOMBOL
           ============================== */

        document
            .getElementById(
                "navigation-button"
            )
            .addEventListener(
                "click",
                function () {

                    if (
                        navigationActive
                    ) {

                        hentikanNavigasi();

                    } else {

                        mulaiNavigasi();

                    }

                }
            );

    }


    /* =====================================================
       UPDATE SAAT RUTE BERUBAH
       ===================================================== */

    document.addEventListener(
        "change",
        function (event) {

            if (
                event.target &&
                event.target.id ===
                "rute-evakuasi-filter"
            ) {

                var total =
                    getSelectedRouteLength();


                var element =
                    document.getElementById(
                        "navigation-total"
                    );


                if (element) {

                    element.textContent =
                        formatJarak(total);

                }


                distanceTravelled = 0;

                updateNavigationStats();

            }

        }
    );


    /* =====================================================
       JALANKAN SETELAH DASHBOARD SELESAI
       ===================================================== */

    function tungguDashboard() {

        if (
            document.getElementById(
                "dashboard-stats"
            )
        ) {

            buatNavigationToolbar();

            return;

        }


        setTimeout(
            tungguDashboard,
            300
        );

    }


    tungguDashboard();


})();

</script>
	<script>
/* =========================================================
   GPS OTOMATIS SAAT WEBGIS DIBUKA
   Tidak menghitung jarak tempuh
   ========================================================= */

(function () {

    function tampilkanGPSAwal(position) {

        var lat =
            position.coords.latitude;

        var lng =
            position.coords.longitude;

        var accuracy =
            position.coords.accuracy;

        console.log(
            "GPS AWAL:",
            lat,
            lng,
            "akurasi:",
            accuracy,
            "meter"
        );


        /* =========================================
           TAMPILKAN MARKER GPS
           ========================================= */

        if (
            typeof buatMarkerGPS === "function"
        ) {

            buatMarkerGPS(
                lat,
                lng,
                accuracy
            );

        }


        /* =========================================
           PINDAHKAN PETA KE POSISI USER
           ========================================= */

        map.setView(
            [lat, lng],
            18,
            {
                animate: true
            }
        );

    }


    /* =============================================
       ERROR GPS
       ============================================= */

    function errorGPS(error) {

        console.log(
            "GPS awal tidak tersedia:",
            error.message
        );

    }


    /* =============================================
       TUNGGU PETA SELESAI
       ============================================= */

    function mulaiGPSOtomatis() {

        if (
            typeof map === "undefined"
        ) {

            setTimeout(
                mulaiGPSOtomatis,
                500
            );

            return;

        }


        if (
            !navigator.geolocation
        ) {

            console.log(
                "Browser tidak mendukung GPS."
            );

            return;

        }


        console.log(
            "Mencari posisi GPS..."
        );


        navigator.geolocation.getCurrentPosition(
            tampilkanGPSAwal,
            errorGPS,
            {
                enableHighAccuracy: true,
                timeout: 15000,
                maximumAge: 0
            }
        );

    }


    /* =============================================
       JALANKAN
       ============================================= */

    mulaiGPSOtomatis();


})();
</script>
